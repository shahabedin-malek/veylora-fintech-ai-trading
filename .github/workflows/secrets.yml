name: Secret scan

# Cheap and high-value: a leaked key in a commit is expensive to undo, so this runs on
# every push and PR (like docs.yml) rather than only on main. gitleaks reads .gitleaks.toml,
# which extends the default ruleset and allow-lists known placeholders/vendor docs.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan can check the commits being pushed.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
