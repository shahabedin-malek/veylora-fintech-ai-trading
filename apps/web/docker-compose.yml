# Self-hosted target for Veylora Fintech AI Trading.
#
#   1. Provide a strong secret (compose reads ./apps/web/.env for substitution):
#        echo 'SESSION_SECRET='$(openssl rand -base64 32) >> .env
#   2. Create the schema + seed sample accounts (once):
#        docker compose run --rm init
#   3. Start the app:
#        docker compose up -d
#        open http://localhost:3000
#
# See docs/DEPLOYMENT.md for the PostgreSQL variant, TLS/reverse-proxy notes,
# and rollback.

name: veylora

services:
  web:
    build:
      context: .
      target: runner
      args:
        # Public, build-time (inlined into the client bundle). Empty ⇒ the
        # WalletConnect QR connector is not offered; injected wallets still work.
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    image: veylora-web:local
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      # Fails closed if unset: the app refuses to sign sessions without it.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the shell or .env}
      MARKET_PROVIDER: ${MARKET_PROVIDER:-auto}     # auto | coingecko | offline
      NEWS_FEEDS: ${NEWS_FEEDS:-}                   # empty ⇒ real public defaults
      MIN_TRADE_USD: ${MIN_TRADE_USD:-20}
      WITHDRAW_FEE_BPS: ${WITHDRAW_FEE_BPS:-100}
      # Wallet sign-in (SIWE). Both optional; see docs/NETWORK_BOUNDARY.md.
      SIWE_DOMAIN: ${SIWE_DOMAIN:-}                           # empty ⇒ request host
      ADMIN_WALLET_ADDRESSES: ${ADMIN_WALLET_ADDRESSES:-}     # empty ⇒ DB role only
      # Site owner(s). Defaults to the known owner wallets; empty ⇒ no owner.
      OWNER_WALLET_ADDRESSES: ${OWNER_WALLET_ADDRESSES:-0x5a407Ff50d55142c36144B390972c51A768eBf8c,0x4ba94f5D72adCCA2d5427D91a74758b2c1B16aD4}
    ports:
      - "3000:3000"
    volumes:
      - veylora-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(process.env.PORT || 3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # One-off task: apply the schema and seed the sample + admin accounts into the
  # shared volume. Uses the builder image, which carries prisma + tsx.
  #   docker compose run --rm init
  init:
    build:
      context: .
      target: builder
    image: veylora-init:local
    environment:
      DATABASE_URL: file:/app/data/prod.db
    volumes:
      - veylora-data:/app/data
    command: sh -c "npm run db:deploy && npm run db:seed"
    profiles: ["init"]

volumes:
  veylora-data:
