# Self-hosted target for Veylora Fintech AI Trading (simulated).
#
#   1. Provide a strong secret (compose reads ./apps/web/.env for substitution):
#        echo 'SESSION_SECRET='$(openssl rand -base64 32) >> .env
#   2. Create the schema + seed sample accounts (once):
#        docker compose run --rm init
#   3. Start the app:
#        docker compose up -d
#        open http://localhost:3000
#
# See docs/DEPLOYMENT.md for the PostgreSQL variant, TLS/reverse-proxy notes,
# and rollback.

name: veylora

services:
  web:
    build:
      context: .
      target: runner
    image: veylora-web:local
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      # Fails closed if unset: the app refuses to sign sessions without it.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the shell or .env}
      MARKET_PROVIDER: ${MARKET_PROVIDER:-auto}     # auto | coingecko | simulated
      NEWS_FEEDS: ${NEWS_FEEDS:-}                   # empty ⇒ real public defaults
      MIN_TRADE_USD: ${MIN_TRADE_USD:-20}
      WITHDRAW_FEE_BPS: ${WITHDRAW_FEE_BPS:-100}
    ports:
      - "3000:3000"
    volumes:
      - veylora-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(process.env.PORT || 3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # One-off task: apply the schema and seed the sample + admin accounts into the
  # shared volume. Uses the builder image, which carries prisma + tsx.
  #   docker compose run --rm init
  init:
    build:
      context: .
      target: builder
    image: veylora-init:local
    environment:
      DATABASE_URL: file:/app/data/prod.db
    volumes:
      - veylora-data:/app/data
    command: sh -c "npm run db:deploy && npm run db:seed"
    profiles: ["init"]

volumes:
  veylora-data:
